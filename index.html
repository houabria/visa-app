<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f3a5f"><title>بحث التأشيرات</title>
<style>
:root{--n:#1f3a5f;--g:#e6c36a;--bg:#f4f6f9;--m:#6b7b8d}
*{box-sizing:border-box}body{margin:0;font-family:'Segoe UI',Tahoma,Arial,sans-serif;background:var(--bg);color:#1b2733;padding-bottom:100px}
header{background:var(--n);color:#fff;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:5}
header b{font-size:17px}header small{display:block;color:var(--g)}
button{font:inherit;border:0;border-radius:8px;padding:9px 14px;background:#e3eaf3;color:var(--n);cursor:pointer}
button.p{background:var(--n);color:#fff;font-weight:700}
input,select{font:inherit;padding:9px;border:1px solid #cfd8e3;border-radius:8px;background:#fff;width:100%;min-width:0}
.bar{padding:10px 12px;display:grid;gap:8px}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}
.row label{flex:none;font-size:12px;color:var(--m)}.row input[type=checkbox]{width:auto;flex:none}
.card{background:#fff;border:1px solid #d5dde7;border-radius:12px;margin:8px 12px;padding:10px}
.card.on{border-color:var(--n);box-shadow:0 0 0 2px var(--n) inset}
.top{display:flex;gap:10px;align-items:flex-start}.ck{flex:none;width:20px;height:20px;border:2px solid #b8c4d2;border-radius:50%;margin-top:2px}
.on .ck{background:var(--n);border-color:var(--n);box-shadow:0 0 0 3px #fff inset}
.ti{flex:1}small{color:var(--m)}.pz{text-align:left}.pz b{display:block;color:#0f6b3d;font-size:17px}
.mod{background:#fff3cd;border-radius:6px;padding:0 4px}.mt{margin-top:6px;font-size:13px}
.dt{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:8px;font-size:13px}.dt[hidden]{display:none}
.dt ul{margin:2px 0;padding-inline-start:16px}.dt .fr{direction:ltr;color:#33475b}.w{color:#b00020;grid-column:1/-1}
.ac{display:flex;gap:8px;margin-top:8px}.ac button{padding:6px 12px;font-size:13px}
.fx{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #d5dde7;padding:8px 12px calc(8px + env(safe-area-inset-bottom));display:grid;gap:8px;z-index:6}
.fx .row button{padding:11px}dialog{border:0;border-radius:12px;padding:16px;width:min(92vw,380px)}dialog::backdrop{background:#0006}
dialog label{display:block;margin:8px 0 3px;font-size:13px;color:var(--m)}
#ts{position:fixed;bottom:120px;left:50%;transform:translateX(-50%);background:#16304f;color:#fff;padding:8px 16px;border-radius:20px;opacity:0;transition:.3s;pointer-events:none;z-index:30}#ts.on{opacity:1}
html{-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}body{overscroll-behavior-y:none}
</style></head><body>
<header><div><b>✈ بحث عروض التأشيرات</b><small id="ag"></small></div><button id="st">⚙</button></header>
<div class="bar"><input id="q" type="search" placeholder="🔍 بحث: دولة، نوع، وثيقة... (عربي / Français)">
<div class="row"><label><input type="checkbox" id="nt"> بدون تنقل العميل</label><span id="cnt" style="text-align:left;color:var(--m)"></span></div></div>
<div id="list"></div>
<div class="fx"><div class="row"><select id="lg"><option value="both">عربي + الأصلي</option><option value="ar">عربي فقط</option><option value="fr">الأصلي فقط</option></select></div>
<div class="row"><button class="p" id="cp">📋 نسخ التأشيرة المطلوبة (<span id="sn">0</span>)</button></div></div>
<dialog id="ed"><b id="en"></b><label>سعر القائمة الأصلي: <bdi id="eo"></bdi></label><label>سعر الشراء الجديد (دج)</label><input id="ev" type="number" inputmode="numeric">
<div class="row" style="margin-top:12px"><button class="p" id="es">حفظ</button><button id="er">الأصلي</button><button onclick="this.closest('dialog').close()">إلغاء</button></div></dialog>
<dialog id="sd"><b>إعدادات الوكالة</b><label>اسم الوكالة</label><input id="sa"><label>رقم الهاتف</label><input id="sp" inputmode="tel"><label>مبلغ الفائدة (دج)</label><input id="pf" type="number" inputmode="numeric">
<div class="row" style="margin-top:12px"><button class="p" id="ss">حفظ</button><button id="sr">إعادة كل الأسعار للأصل</button><button onclick="this.closest('dialog').close()">إغلاق</button></div></dialog>

D.forEach(r=>r.h=nz([r.p,r.pa,r.s,r.t,r.ta,r.d,r.da,r.n,r.na,r.x,...r.docs.flat()].join(' ')));

 $('#list').innerHTML=L.map(r=>{const b=pr(r),m=S.prices[r.k]!=null;
